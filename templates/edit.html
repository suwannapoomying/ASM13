<!doctype html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <title>แก้ไขเค้ก</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="page-wrapper">
        <div class="form-card">
            <h1>แก้ไขสินค้า: {{ cake.name }}</h1>
            <p>ปรับข้อมูลเค้กเพื่อให้ข้อมูลในร้านเป็นปัจจุบัน</p>
            <form method="post">
                <div class="form-group">
                    <label>ชื่อเค้ก</label>
                    <input type="text" name="name" value="{{ cake.name }}" required>
                </div>
                <div class="form-group">
                    <label>ราคา (บาท)</label>
                    <input type="number" name="price" step="0.01" value="{{ cake.price }}" required>
                </div>
                <div class="form-group">
                    <label>จำนวนคงเหลือ</label>
                    <input type="number" name="stock" value="{{ cake.stock }}" required>
                </div>
                <div class="form-group">
                    <label>URL รูปภาพ</label>
                    <input type="text" name="image" value="{{ cake.image }}">
                </div>
                <div class="form-group">
                    <label>หมวดหมู่</label>
                    <select name="category_id" required>
                        {% for category in categories %}
                            <option value="{{ category.id }}" {% if category.id == cake.category_id %}selected{% endif %}>
                                {{ category.name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" class="button">บันทึกการแก้ไข</button>
                    <a class="button-secondary" href="{{ url_for('cake_menu') }}">กลับไปหน้ารายการเค้ก</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
