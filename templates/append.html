<!doctype html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <title>เพิ่มเค้กใหม่</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="page-wrapper">
        <div class="form-card">
            <h1>เพิ่มสินค้าเค้ก</h1>
            <p>กรอกข้อมูลเค้กใหม่เพื่อเพิ่มลงในเมนูร้านของคุณ</p>
            <form method="post">
                <div class="form-group">
                    <label>ชื่อเค้ก</label>
                    <input type="text" name="name" required>
                </div>
                <div class="form-group">
                    <label>ราคา (บาท)</label>
                    <input type="number" name="price" step="0.01" value="0" required>
                </div>
                <div class="form-group">
                    <label>จำนวนคงเหลือ</label>
                    <input type="number" name="stock" value="0" required>
                </div>
                <div class="form-group">
                    <label>URL รูปภาพ</label>
                    <input type="text" name="image" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label>หมวดหมู่</label>
                    <select name="category_id" required>
                        {% for category in categories %}
                            <option value="{{ category.id }}">{{ category.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" class="button">บันทึก</button>
                    <a class="button-secondary" href="{{ url_for('cake_menu') }}">กลับไปหน้ารายการเค้ก</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
